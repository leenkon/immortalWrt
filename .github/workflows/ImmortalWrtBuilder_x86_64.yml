name: ImmortalWrtBuilder_x86_64
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
    inputs:
      core: {description: '核心(编译源): immortalwrt 或 fanchmwrt', required: true, type: choice, options: [immortalwrt, fanchmwrt]}
      version: {description: '版本 (immortalwrt: 25.12.0/25.12.1 | fanchmwrt: 25.12.2/25.12.3/25.12.4)', required: true, type: string, default: '25.12.1'}
      profile: {description: '配置 (fanchmwrt 仅支持 Main/Mini)', required: true, type: choice, options: [Main, Mini, Full, Full-noadgh]}
      custom_ip: {description: '自定义IP', type: string, default: ''}
      custom_gateway: {description: '网关(旁路由)', type: string, default: ''}
      pppoe_username: {description: 'PPPoE账号', type: string, default: ''}
      pppoe_password: {description: 'PPPoE密码', type: string, default: ''}
      install_oaf: {description: '安装OAF(仅immortalwrt有效)', type: boolean, default: false}
      root_password: {description: 'root密码', type: string, default: ''}
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: .

      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: 拉取源码
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/${{ github.event.inputs.core }}.conf
          rm -rf openwrt
          timeout 180 git clone --depth 1 "$REPO_URL" openwrt
          cd openwrt
          timeout 60 git fetch origin tag "${REF_PREFIX}${{ github.event.inputs.version }}" --depth 1
          git checkout "${REF_PREFIX}${{ github.event.inputs.version }}"

      - name: 配置与编译
        id: build
        run: |
          set -e
          source $GITHUB_WORKSPACE/cores/${{ github.event.inputs.core }}.conf
          FEEDS_FILE_ABS="$GITHUB_WORKSPACE/$FEEDS_FILE"
          FILES_DIR_ABS="$GITHUB_WORKSPACE/$FILES_DIR"
          # 修复 Windows 提交可能带来的 CRLF（路由器 ash 不兼容），覆盖脚本/YAML/init.d
          find $GITHUB_WORKSPACE -type f \( -name "*.sh" -o -name "*.yaml" -o -name "dns-hijack" -o -name "99-adgh-filters" -o -path "*/init.d/*" \) \
            -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          cd openwrt
          case "${{ github.event.inputs.profile }}" in
            Main)        CFG_PREFIX=default; RUN_TYPE=main;;
            Mini)        CFG_PREFIX=mini;    RUN_TYPE=bypass;;
            Full)        CFG_PREFIX=full;    RUN_TYPE=full;;
            Full-noadgh) CFG_PREFIX=full;    RUN_TYPE=full; NO_ADGH=true;;
            *) echo "未知 profile: ${{ github.event.inputs.profile }}"; exit 1;;
          esac
          NO_ADGH=${NO_ADGH:-false}
          MAIN_VER="${{ github.event.inputs.version }}"; MAIN_VER="${MAIN_VER%.*}"
          IS_FANCHM=false; [ "${{ github.event.inputs.core }}" = "fanchmwrt" ] && IS_FANCHM=true
          # fanchmwrt 仅支持 Main/Mini；其余 profile 按 Main 处理
          if $IS_FANCHM && [ "${{ github.event.inputs.profile }}" != "Main" ] && [ "${{ github.event.inputs.profile }}" != "Mini" ]; then
            echo "[build] fanchmwrt 仅支持 Main/Mini，profile=${{ github.event.inputs.profile }} 按 Main 处理"
            CFG_PREFIX=default; RUN_TYPE=main; NO_ADGH=false
          fi

          # OAF/OC/ADGH 仅 immortalwrt 需要
          INSTALL_OAF=false; WITH_OC=false; WITH_ADGH=false
          if ! $IS_FANCHM; then
            [[ ("${{ github.event.inputs.install_oaf }}" == "true" && "$RUN_TYPE" == "main") || "$RUN_TYPE" == "full" ]] && INSTALL_OAF=true || INSTALL_OAF=false
            [[ "$RUN_TYPE" == "bypass" || "$RUN_TYPE" == "full" ]] && WITH_OC=true || WITH_OC=false
            [[ "$RUN_TYPE" == "bypass" || ("$RUN_TYPE" == "full" && "$NO_ADGH" != "true") ]] && WITH_ADGH=true || WITH_ADGH=false
          fi

          chmod +x $GITHUB_WORKSPACE/scripts/diy.sh
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p before -t $RUN_TYPE --core ${{ github.event.inputs.core }} --feeds "$FEEDS_FILE_ABS"
          ./scripts/feeds update -a

          if $INSTALL_OAF; then
            rm -rf package/{luci-app-oaf,open-app-filter,oaf} feeds/packages/{net/open-app-filter,luci/luci-app-oaf,kernel/oaf} package/OpenAppFilter
            timeout 120 git clone --depth 1 https://github.com/destan19/OpenAppFilter package/OpenAppFilter
            cp -f $GITHUB_WORKSPACE/oaf_files/feature.cfg package/OpenAppFilter/open-app-filter/files/
            cp -rf $GITHUB_WORKSPACE/oaf_files/app_icons/ package/OpenAppFilter/luci-app-oaf/htdocs/luci-static/resources/
          fi

          if $WITH_OC; then
            chmod +x $GITHUB_WORKSPACE/scripts/upgrade-openclash-luci.sh
            $GITHUB_WORKSPACE/scripts/upgrade-openclash-luci.sh .
          fi

          # AdGuardHome LuCI 壳去除对引擎包(adguardhome)的硬依赖（仅 immortalwrt 25.12）
          if ! $IS_FANCHM && [ "$MAIN_VER" = "25.12" ]; then
            ADGH_LUCI_MK="feeds/luci/applications/luci-app-adguardhome/Makefile"
            if [ -f "$ADGH_LUCI_MK" ]; then
              sed -i -e 's/+adguardhome //g' -e '/LUCI_EXTRA_DEPENDS:=adguardhome/d' "$ADGH_LUCI_MK"
              echo "[build] 已去除 luci-app-adguardhome 对 adguardhome 的硬依赖（引擎走二进制注入）"
            else
              echo "[build] 警告: 未找到 luci-app-adguardhome Makefile，跳过依赖去除"
            fi
          fi

          ./scripts/feeds install -a -f
          if $IS_FANCHM; then
            printf '%s\n' \
              'CONFIG_TARGET_x86=y' \
              'CONFIG_TARGET_x86_64=y' \
              'CONFIG_USE_APK=y' \
              'CONFIG_TARGET_ROOTFS_PARTSIZE=960' \
              'CONFIG_PACKAGE_kmod-e1000=y' \
              'CONFIG_PACKAGE_kmod-e1000e=y' \
              'CONFIG_PACKAGE_kmod-igb=y' \
              'CONFIG_PACKAGE_kmod-igc=y' \
              'CONFIG_PACKAGE_kmod-vmxnet3=y' \
              'CONFIG_PACKAGE_kmod-r8169=y' \
              'CONFIG_PACKAGE_kmod-ixgbe=y' \
              'CONFIG_PACKAGE_kmod-ppp=y' \
              'CONFIG_PACKAGE_kmod-pppoe=y' \
              'CONFIG_PACKAGE_kmod-pppox=y' \
              'CONFIG_PACKAGE_kmod-nft-offload=y' \
              > .config
            sed -i 's/\r$//' .config
            echo "[build] FanchmWrt: 已写入最小 .config（target+kmod），make defconfig 将展开"
          else
            cp $GITHUB_WORKSPACE/configs/${CONFIG_PREFIX}-${CFG_PREFIX}.config .config
            sed -i 's/\r$//' .config
            if [ "$RUN_TYPE" = "full" ] && [ "$NO_ADGH" = "true" ]; then
              sed -i 's/^CONFIG_PACKAGE_luci-app-adguardhome=y/# &/' .config
              sed -i 's/^CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y/# &/' .config
              echo "[build] Full-noadgh: 已禁用 luci-app-adguardhome（无引擎）"
            fi
          fi
          $INSTALL_OAF && echo -e "\nCONFIG_PACKAGE_luci-app-oaf=y" >> .config || true
          ROOTPWD="${{ github.event.inputs.root_password }}"; ROOTPWD="${ROOTPWD:-password}"
          CIP="${{ github.event.inputs.custom_ip }}"; CGW="${{ github.event.inputs.custom_gateway }}"
          PUSER="${{ github.event.inputs.pppoe_username }}"; PPASS="${{ github.event.inputs.pppoe_password }}"
          NOADGH_ARG=""
          [ "$NO_ADGH" = "true" ] && NOADGH_ARG="--no-adgh"
          $GITHUB_WORKSPACE/scripts/diy.sh -v $MAIN_VER -p after -t $RUN_TYPE --core ${{ github.event.inputs.core }} --files-dir "$FILES_DIR_ABS" \
            ${CIP:+--ip "$CIP"} ${CGW:+--gateway "$CGW"} \
            ${PUSER:+--pppoe-user "$PUSER"} ${PPASS:+--pppoe-pass "$PPASS"} \
            ${NOADGH_ARG:+"$NOADGH_ARG"} \
            --root-pass "$ROOTPWD"

          $WITH_OC && { chmod +x $GITHUB_WORKSPACE/scripts/upgrade-openclash-core.sh; $GITHUB_WORKSPACE/scripts/upgrade-openclash-core.sh $GITHUB_WORKSPACE; } || true
          if $WITH_ADGH; then
            chmod +x $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh
            $GITHUB_WORKSPACE/scripts/upgrade-adgh-binary.sh $GITHUB_WORKSPACE
          fi
          [[ -d "$FILES_DIR_ABS" ]] && { rm -rf files; cp -rf "$FILES_DIR_ABS" files; } || true

          # FanchmWrt：把 apps/(离线 .apk) 与 lists/(官方源包名) 拷入镜像首启安装目录
          if $IS_FANCHM; then
            mkdir -p files/etc/firstboot-pkgs/lists files/etc/firstboot-pkgs/apps
            cp -f $GITHUB_WORKSPACE/lists/*.txt files/etc/firstboot-pkgs/lists/ 2>/dev/null || true
            cp -f $GITHUB_WORKSPACE/apps/*.apk files/etc/firstboot-pkgs/apps/ 2>/dev/null || true
          fi

          # 按 profile 删除不需要的静态文件（仅 immortalwrt）
          if ! $IS_FANCHM; then
          case "$RUN_TYPE" in
            main)   rm -rf files/etc/{adguardhome,openclash}; rm -f files/usr/bin/AdGuardHome files/etc/init.d/adguardhome files/etc/config/adguardhome;;
            bypass) rm -f files/usr/sbin/dns-hijack;;
            full)   [ "$NO_ADGH" = "true" ] && { rm -rf files/etc/adguardhome; rm -f files/usr/bin/AdGuardHome files/etc/init.d/adguardhome files/etc/config/adguardhome; } || true;;
          esac
          fi
          find files/ -type f \( -path "*/sbin/*" -o -path "*/init.d/*" -o -path "*/hotplug.d/*" -o -path "*/uci-defaults/*" -o -name "*.sh" \) -exec chmod 755 {} + 2>/dev/null || true
          make defconfig && make download && make clean
          make -j$(nproc) || make -j1 V=s
          TS=$(date +%Y%m%d%H%M%S)
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          shopt -s nullglob; for f in bin/targets/x86/64/*combined.img.gz; do mv "$f" "${f%.img.gz}-$TS.img.gz"; done; shopt -u nullglob

      - name: 上传固件
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.core }} ${{ github.event.inputs.version }} (${{ github.event.inputs.profile }})
          tag_name: ${{ github.event.inputs.core }}-${{ github.event.inputs.version }}-${{ github.event.inputs.profile }}
          files: openwrt/bin/targets/x86/64/*-${{ steps.build.outputs.timestamp }}.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
