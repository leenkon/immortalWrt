# FanchmWrt 核心描述（OpenWrt fork，官方宣称原生 fwx 应用过滤）
# 重要前提：公开 v25.12.4 主树仅含 fwx 的 LuCI UI 包（luci-app-fwx-*），
#           并不包含 fwxd 内核模块（kmod）。缺内核模块时 fwx 实际不可用。
#           因此本编译分支不注入 fwx，仅做：
#             - 原生编译（不动官方软件包）
#             - 拉取代码后，不依赖本地 .config 种子：仅注入最小 target + 必要内核模块 + apk，
#               然后 make defconfig 展开为完整配置直接编译（见 build.sh / workflow 内联最小种子）
#             - 仅 IP / WAN / 主机名 在编译期定制（diy.sh after 写入 99-custom.sh）
#             - 其余功能包经 apps/（离线 .apk）+ lists/（官方源在线装）首启联网后安装，装完清理
# 若日后获得 fwxd 内核模块源码，再补 CONFIG_PACKAGE_kmod-fwxd=y 并引入 fanchmwrt-packages feed。
CORE_NAME="fanchmwrt"
REPO_URL="https://github.com/fanchmwrt/fanchmwrt"
REF_PREFIX="v"
VERSION_OPTIONS="25.12.4 25.12.3 25.12.2"
FEEDS_FILE="feeds/fanchmwrt-25.12.conf"
APPFILTER="fwx"
FILES_DIR="files-fanchmwrt"
