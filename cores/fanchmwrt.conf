# FanchmWrt 核心描述（OpenWrt fork，官方宣称原生 fwx 应用过滤）
# 编译策略（与原 immortalwrt 核心解耦，仅做轻量定制）：
#   - 原生编译，不依赖本地 .config 种子：build.sh / workflow 内联最小 target + 必要 kmod + apk，
#     再由 make defconfig 展开为完整配置后直接编译
#   - 仅 IP / WAN / 主机名 在编译期定制（scripts/diy.sh after 写入 99-custom.sh）
#   - 其余功能包经 apps/（离线 .apk）+ lists/（官方源在线装）首启联网后安装，装完自清理
# feeds：fanchmwrt-25.12.conf 已钉入官方源 + fanchmwrt-packages feed（发布提交，保证可复现）。
#   fwx 是否可用（fanchmwrt-packages 是否提供 kmod-fwxd / luci-app-fwx-* 且 vermagic 匹配自编译内核）
#   待首次构建实测确认；本分支不主动注入 fwx 包。
CORE_NAME="fanchmwrt"
REPO_URL="https://github.com/fanchmwrt/fanchmwrt"
REF_PREFIX="v"
VERSION_OPTIONS="25.12.4 25.12.3 25.12.2"
FEEDS_FILE="feeds/fanchmwrt-25.12.conf"
APPFILTER="fwx"
FILES_DIR="files-fanchmwrt"
