# FanchmWrt 核心描述（OpenWrt fork，原生 fwx 应用过滤）
# 编译策略（与原 immortalwrt 核心解耦，仅做轻量定制）：
#   - 原生编译，不依赖本地 .config 种子：build.sh / workflow 内联最小 target + 必要 kmod + apk，
#     再由 make defconfig 展开为完整配置后直接编译
#   - 仅 IP / WAN / 主机名 在编译期定制（scripts/diy.sh after 写入 99-custom.sh）
#   - 其余功能包经 apps/（离线 .apk）+ lists/（官方源在线装）首启联网后安装，装完自清理
# 源码/版本：fwx 内核栈(kmod-fwx/fwxd) 仅在主仓库【分支】fanchmwrt-25.12.4 / fanchmwrt-25.12.2，
#   所有 v25.12.x tag 均不含（已用 tag 树核实）。故 FanchmWrt 构建改用对应【分支】fanchmwrt-${VERSION}
#   （build.sh / workflow 覆写默认 tag 取源），不再 checkout tag；代价：分支移动、不可钉 tag 复现。
#   VERSION_OPTIONS 仅保留有对应分支的版本（25.12.3 无 fanchmwrt-25.12.3 分支，已剔除）。
# feeds：fanchmwrt-25.12.conf 已钉入官方源 + fanchmwrt-packages feed。本核心在 build.sh 内联 .config
#   中显式选入 luci + 全部 luci-app-fwx-* + kmod-fwx/fwxd（见 build.sh），即 FanchmWrt 品牌后台。
CORE_NAME="fanchmwrt"
REPO_URL="https://github.com/fanchmwrt/fanchmwrt"
REF_PREFIX="v"
VERSION_OPTIONS="25.12.4 25.12.2"
FEEDS_FILE="feeds/fanchmwrt-25.12.conf"
APPFILTER="fwx"
FILES_DIR="files-fanchmwrt"
